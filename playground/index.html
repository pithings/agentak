<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- `viewport-fit=cover` is what makes the `env(safe-area-inset-*)` the chat
         pads with anything other than 0 on a phone. `interactive-widget` makes
         the virtual keyboard shrink the layout viewport where it is supported,
         so `dvh` stops counting the rows the keyboard covers. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>Agentak — component workbench</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
