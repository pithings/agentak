# yaml-language-server: $schema=https://unpkg.com/undocs/schema/config.json

name: "Agentak"
shortDescription: "Browser-native AI chat with WebMCP page tools."
description: "Embed browser-native AI chat with direct or on-device models. Agentak discovers WebMCP page tools and includes a Chrome side-panel agent."
github: "pithings/agentak"
themeColor: cyan
url: "https://agentak.dev"
redirects:
  "/chat-components": "/widget"
  "/chrome-extension": "/extension"
  "/pi-agent": "/agents/pi-agent"
  "/pi-agent/providers-and-models": "/agents/pi-agent/providers-and-models"
  "/pi-agent/on-device-models": "/agents/pi-agent/on-device-models"
  "/pi-agent/tools-and-approvals": "/agents/pi-agent/tools-and-approvals"
  "/pi-agent/webmcp": "/agents/pi-agent/webmcp"
  "/pi-agent/storage-and-api-keys": "/agents/pi-agent/storage-and-api-keys"
  "/pi-agent/conversations": "/agents/pi-agent/conversations"
  "/pi-agent/runtime-behavior": "/agents/pi-agent/runtime-behavior"
  "/pi-agent/advanced-api": "/agents/pi-agent/advanced-api"
  "/custom-agents": "/agents/custom-agents"
  "/conversations": "/agents/pi-agent/conversations"

landing:
  title: "Agentak — browser-native AI chat with WebMCP"
  description: "Add a browser-native AI agent to any page. Use direct or on-device models, typed tools, and tools published by the page through WebMCP."
  heroTitle: "Agentak"
  heroSubtitle: "AI chat that works with your page."
  heroDescription: "Embed a complete browser-native agent. It can use direct or on-device models, call your typed tools, and discover actions that the page publishes through WebMCP."
  heroLinks:
    webmcp:
      label: "Explore WebMCP"
      icon: "system-uicons:browser"
      to: "/agents/pi-agent/webmcp"
      order: 10
    chrome:
      label: "Chrome Extension"
      icon: "i-reicon-chrome"
      to: "/extension"
      order: 20
  heroCode:
    title: "browser.ts"
    lang: "ts"
    content: |
      import { mountChat } from "agentak";
      import { createPiSession } from "agentak/pi";

      const session = createPiSession({
        history: true,
        page: true, // discover this page's WebMCP tools
      });
      mountChat("#chat", { session });
  featuresTitle: "Everything a browser agent needs"
  features:
    - title: "Browser-native runtime"
      icon: "system-uicons:browser"
      description: "No Agentak server is required. Run a local model or call a provider directly from the page."
    - title: "Included Pi agent"
      icon: "i-lucide-bot"
      description: "Streaming, reasoning, providers, model selection, tool calls, approvals, usage, and errors in one session."
    - title: "On-device models"
      icon: "i-lucide-cpu"
      description: "Use Chrome Built-in AI or run small GGUF models through llama.cpp and WebAssembly with wllama."
    - title: "Complete chat UX"
      icon: "i-lucide-message-square"
      description: "Markdown, code, thinking, tool output, queues, retry, copy, read aloud, slash commands, and mobile keyboard support."
    - title: "WebMCP page tools"
      icon: "i-lucide-wrench"
      description: "Turn on one option to discover structured tools from document.modelContext and keep the tool list current as the page changes."
    - title: "Your framework or none"
      icon: "i-lucide-blocks"
      description: "Use React, Vue, Preact, plain JavaScript, or connect the UI to a custom agent through ChatSession."
